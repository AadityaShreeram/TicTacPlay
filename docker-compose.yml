version: "3.9"

services:
  backend:
    build: ./backend
    container_name: tic_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend:/app
    command: ["npm", "start"]

  mysql:
    image: mysql:8.0
    container_name: tic_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tictacplay
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:latest
    container_name: tic_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
